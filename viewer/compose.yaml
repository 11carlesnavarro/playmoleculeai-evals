# Viewer tasks: a job adds this file with `environment: {extra_docker_compose: [viewer/compose.yaml]}`.
# Harbor runs compose with its own env, so ${PM*} come from .env (make run) and HOST_ARTIFACTS_PATH
# is the trial's artifacts folder.
services:
  main:
    environment:
      VIEWER_URL: http://viewer:9000  # agent.py opens the viewer, trial.py reads it
    volumes: ["project:/app"]  # filled from the image's /app on first use
    depends_on:
      viewer: {condition: service_healthy}
  viewer:
    image: pmai-viewer:latest
    environment:
      PMVIEW_URL:  # the site that serves PMView; not set: the default in server.py
      PM_EMAIL: ${PM_EMAIL:?set it in .env}
      PM_PASSWORD: ${PM_PASSWORD:?set it in .env}
    volumes:
      - project:/files/app
      - ${HOST_ARTIFACTS_PATH:?Harbor sets it}:/logs/artifacts  # events.jsonl and final.png
    healthcheck:  # 200 when the browser has started, or failed to start (then /open gives the reason)
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/healthz')"]
      interval: 5s
      retries: 60
volumes:
  project:
