# Phase 2 in Docker for little money: the cheapest case of each ported set, once (a few cents with gpt-6-luna).
n_attempts: 1
n_concurrent_trials: 4
datasets:
  - path: evals/acellera-bench/cases/structure-analysis
    task_names: [sa-0071]
  - path: evals/acellera-bench/cases/cheminformatics-analysis
    task_names: [sar-descriptors]
  - path: evals/acellera-bench/cases/retrieval-and-selection
    task_names: [rs-uniprot]
  - path: evals/acellera-bench/cases/3d-reasoning
    task_names: [dr-0001]
agents:
  - name: pmai
    import_path: pmai_evals.agent:PmaiAgent
    model_name: gpt-6-luna
    env:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
