id: acellera-bench/cheminformatics-analysis
skill_under_test: sar-analysis
description: |
  Bioactivity and structure activity relationships on a frozen raw ChEMBL
  export. Data hygiene on censored relations, foreign units and missing
  values, repeat measurements, physicochemical descriptors, Bemis-Murcko
  scaffold series, substructure trends, cross-target selectivity,
  activity cliffs and a multi-step selection with two tie-breaks. No case
  queries a database: every input is a fixture file loaded into the
  workspace, and every expected answer is derived from that same file by
  development/build_sar_ground_truth.py.
difficulty: mixed
requires_browser: true
default_timeout_s: null
default_expected_cost_usd: 0.05
tags: [sar, bioactivity, chembl, rdkit, scaffold, cliffs, selectivity, sar-analysis]
