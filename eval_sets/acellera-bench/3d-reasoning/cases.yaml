# Eval set: 3d-reasoning
#
# Every file is uploaded to the project workspace. No structure is loaded in
# the viewer before the prompt. The source identities and answer key are only
# in fixtures/ground_truth.json, which is not uploaded to the agent.

cases:

  - id: dr-0001
    difficulty: hard
    prompt: |
      The files `receptor.pdb`, `attachment_point.pdb`, and
      `candidate_A.sdf` through `candidate_D.sdf` are in your project
      workspace. The four candidate files show the same bound ligand core.
      They differ only in the placement of a terminal region. The zinc marker
      in `attachment_point.pdb` marks the attachment point.

      Which candidate best fits the available three dimensional space while
      it preserves the shared ligand core pose? Reply with one letter inside
      answer tags, for example `<answer>A</answer>`.
    tags: [ligand, fragment-placement, pocket-fit]
    preload:
      project:
        files:
          - dr-0001/receptor.pdb
          - dr-0001/attachment_point.pdb
          - dr-0001/candidate_A.sdf
          - dr-0001/candidate_B.sdf
          - dr-0001/candidate_C.sdf
          - dr-0001/candidate_D.sdf
    assertions:
      - type: python_check
        function: answer_choice
        kwargs: {case_id: dr-0001}
    rubric:
      enabled: false

