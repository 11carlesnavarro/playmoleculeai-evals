id: acellera-bench/retrieval-and-selection
skill_under_test: data-retrieval
description: |
  Finding and choosing external data. Mapping a gene or protein to the
  right database entry, searching the PDB under explicit constraints,
  reconciling residue numbering between PDB and UniProt, reading an
  AlphaFold model, and judging what a crystal construct actually
  contains. Identifiers in, files out. Every expected answer is frozen
  in fixtures/ground_truth.json so grading needs no network.
difficulty: mixed
requires_browser: true
default_timeout_s: null
default_expected_cost_usd: 0.05
tags: [retrieval, uniprot, pdb, sifts, alphafold, selection, data-retrieval]
