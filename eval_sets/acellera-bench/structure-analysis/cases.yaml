# Eval set: structure-analysis
#
# Scope: pulling information out of a 3D structure. Distances,
# angles, contacts, residues within a cutoff of a ligand or partner
# chain, pocket characterisation, SASA, geometric comparisons between
# aligned structures.
#

cases:

  - id: sa-1187
    difficulty: easy
    prompt: |
      Load PDB 1AQ1. Rank the protein residues within 5 Å of the
      bound ligand by their number of heavy-atom contacts. Save the ranking as a CSV in your
      project workspace, with columns `resid` and `contacts`.
    tags: [contact, pocket, ranking, csv]
    timeout_s: 360
    assertions:
      - type: python_check
        function: sa1187_contact_counts
    rubric:
      enabled: false

