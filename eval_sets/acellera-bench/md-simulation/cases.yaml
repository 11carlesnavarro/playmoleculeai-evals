# Eval set: md-simulation
#
# Scope: setup decisions and short-MD sanity for molecular dynamics.
# We never wait for production MD to finish. After the agent stops
# responding, the runner waits up to default_build_wait_s for backend
# jobs to settle, and caps each individual job at default_job_cap_s
# wall time. We grade what survived: the systembuilder build, the
# parameterize/proteinprepare outputs, and partial trajectories from
# simplerun. Cases that are pure diagnosis or design are graded by
# rubric.

cases:

  - id: ms-0712
    difficulty: easy
    prompt: |
      Set up and run a molecular dynamics simulation of Ubiquitin
      (PDB 1UBQ) in TIP3P water with a 10 Å solvent box, auto-
      neutralising the system. No ligand. Use 0.1 ns of equilibration
      and 1 ns of production.
    tags: [apo, protein, tip3p, systembuilder, simplerun]
    timeout_s: 1500
    assertions:
      - type: python_check
        function: ms0712_apo_1ubq_build_and_md
    rubric:
      enabled: false
