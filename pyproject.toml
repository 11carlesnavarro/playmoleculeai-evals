[project]
name = "pmai-evals"
version = "0.2.0"
description = "Evals for PlayMoleculeAI: `pmai run` in Harbor containers, graded with pytest."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Carles Navarro" }]
dependencies = [
    "harbor==0.24.0",  # 0.x moves fast: read the changelog before an upgrade
]

[dependency-groups]
dev = [
    "aiohttp>=3.10",  # viewer/server.py runs in the viewer image; the host needs it for tests only
    "anthropic>=0.39",  # judge.py runs in the image; the host needs it for tests only
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmai_evals"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "viewer"]
extend-exclude = ["tasks/*/*/tests/checks.py"]  # old eval_sets code, copied unchanged by the port

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["viewer"]  # tests/test_viewer_server.py imports server
