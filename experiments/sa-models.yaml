# Phase 3: models and reasoning effort side by side on structure-analysis, once each (30 trials, cheap models).
# Each arm name must be the agent's label (tests/test_agent.py). Effort is also a column in `make view`.
n_attempts: 1
n_concurrent_trials: 8
datasets:
  - path: tasks/structure-analysis
agents:
  - &arm
    name: pmai-effort-xhigh
    import_path: pmai_evals.agent:PmaiAgent
    model_name: gpt-6-luna
    kwargs: {reasoning_effort: xhigh}
    env:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY}  # glm-5.3-flash, also the kilo tier for child agents
  - {<<: *arm, model_name: glm-5.3-flash}
  - {<<: *arm, name: pmai-effort-low, kwargs: {reasoning_effort: low}}
