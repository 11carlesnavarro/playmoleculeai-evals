# Phase 5.7: three molecular-visualization tasks with the viewer sidecar (make viewer first), once, with
# gpt-6-luna: less than $0.05. mv-1jpz has a preload, mv-2ity colors and styles, mv-7fab a viewer selection.
# The tasks link viewer/compose.yaml themselves: no extra_docker_compose here.
n_attempts: 1
n_concurrent_trials: 3
datasets:
  - path: tasks/molecular-visualization
    task_names: [mv-1jpz, mv-2ity, mv-7fab]
agents:
  - name: pmai
    import_path: pmai_evals.agent:PmaiAgent
    model_name: gpt-6-luna
    env:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
